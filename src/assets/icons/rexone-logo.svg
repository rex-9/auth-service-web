<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Glass Gradient -->
    <radialGradient id="glassBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24101A" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#160810" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0E040A" stop-opacity="1" />
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="neonBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5E62" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E8334A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF7556" stop-opacity="0.5" />
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Neon Tube Core Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glassmorphic Crest -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#glassBg)" />
  <rect x="4.5" y="4.5" width="91" height="91" rx="25.5" stroke="url(#neonBorder)" stroke-width="1.5" />

  <!-- Subtle Ambient Radial Glow -->
  <circle cx="50" cy="50" r="30" fill="#FF5E62" opacity="0.2" filter="url(#ambientGlow)" />

  <!-- Outer Neon Halo Layer -->
  <g stroke="#E8334A" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#ambientGlow)">
    <path d="M 28 72 V 28 C 28 24 38 22 47 27 C 53 30 51 40 43 44 C 36 47 33 49 33 50" stroke-width="10" />
    <path d="M 33 50 C 37 50 44 65 52 70 C 60 74 72 70 76 60 C 80 48 76 34 66 31 C 55 28 50 36 52 44 C 54 50 63 52 70 48" stroke-width="10" />
  </g>

  <!-- Middle Vibrant Neon Tube Layer -->
  <g stroke="#FF5E62" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    <path d="M 28 72 V 28 C 28 24 38 22 47 27 C 53 30 51 40 43 44 C 36 47 33 49 33 50" stroke-width="5" />
    <path d="M 33 50 C 37 50 44 65 52 70 C 60 74 72 70 76 60 C 80 48 76 34 66 31 C 55 28 50 36 52 44 C 54 50 63 52 70 48" stroke-width="5" />
  </g>

  <!-- Core Hot-White Neon Filament -->
  <g stroke="#FFF2F4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 72 V 28 C 28 24 38 22 47 27 C 53 30 51 40 43 44 C 36 47 33 49 33 50" stroke-width="2" />
    <path d="M 33 50 C 37 50 44 65 52 70 C 60 74 72 70 76 60 C 80 48 76 34 66 31 C 55 28 50 36 52 44 C 54 50 63 52 70 48" stroke-width="2" />
  </g>
</svg>
